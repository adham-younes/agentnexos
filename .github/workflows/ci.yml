name: Production verification
on:
  workflow_dispatch:
    inputs:
      released_commit:
        description: '40-character commit SHA already deployed to agynexa.si; run once per release'
        required: true
        type: string
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.released_commit }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: One scoped production run
        env:
          RELEASED_COMMIT: ${{ inputs.released_commit }}
        run: pnpm verify:production --commit "$RELEASED_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: output/premium-platform/
          if-no-files-found: ignore
