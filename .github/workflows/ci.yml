name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Typecheck
        run: pnpm run typecheck

      - name: i18n Check
        run: pnpm run i18n:check

      - name: Agent workflow and API boundary tests
        run: pnpm run test:agentnexos

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Install browser for release verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify built pages and complete browser journeys
        shell: bash
        run: |
          pnpm start --port 3000 > /tmp/agentnexos-server.log 2>&1 &
          agentnexos_server_pid=$!
          trap 'kill "$agentnexos_server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ar > /dev/null; then break; fi
            sleep 1
          done
          pnpm verify:site http://localhost:3000

      - name: Preserve browser verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: output/release-verification/report.json
          if-no-files-found: ignore
