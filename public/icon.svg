<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #000000; }
      .pillar { fill: #FFFFFF; }
      .diagonal { fill: #E4E4E7; }
      .node-core { fill: #38BDF8; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #09090B; stroke: rgba(255, 255, 255, 0.14); stroke-width: 2; }
      .pillar { fill: #FFFFFF; }
      .diagonal { fill: #D4D4D8; }
      .node-core { fill: #38BDF8; }
    }
  </style>
  <defs>
    <linearGradient id="nexus-grad" x1="42" y1="42" x2="138" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle container -->
  <rect class="bg" x="1" y="1" width="178" height="178" rx="38" />
  
  <!-- Left Pillar -->
  <rect class="pillar" x="42" y="44" width="22" height="92" rx="4" />

  <!-- Right Pillar -->
  <rect class="pillar" x="116" y="44" width="22" height="92" rx="4" />

  <!-- Orchestration Diagonal -->
  <path class="diagonal" d="M 42 48 L 118 128 H 138 L 62 48 H 42 Z" />

  <!-- Orchestration Core Node (Central Nexus) -->
  <circle cx="90" cy="90" r="10" fill="url(#nexus-grad)" filter="url(#soft-glow)" />
  <circle cx="90" cy="90" r="4" fill="#FFFFFF" />
</svg>